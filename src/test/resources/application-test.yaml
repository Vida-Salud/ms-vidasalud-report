spring:
  datasource:
    url: jdbc:h2:mem:vidasalud-report;MODE=Oracle;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop

  kafka:
    admin:
      auto-create: false   # sin brokers en el CI: no crear el DLT al arrancar el contexto
    listener:
      auto-startup: false  # ni arrancar el consumidor
